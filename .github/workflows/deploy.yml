# Check, build, publish.
#
# One workflow rather than two, so what is published is exactly what was
# checked: `deploy` needs `check`, and a red check stops the publish instead of
# racing it. Pull requests run the checks and stop there.

name: Check and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time, and never cancelled half-way: a partially published
# site is worse than an old one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - run: npm ci

      # The model, the grid grouping, and the datasets against their own
      # manifest. No network, about a second.
      #
      # `npm run test:smoke` drives the built site in a real browser and is the
      # only thing that catches a rule that hides a block, a control another
      # element sits on top of, or a chart that paints nothing. It is run by
      # hand rather than here: it needs Chrome and it is timing-sensitive, and a
      # check that goes red for reasons unrelated to the change teaches people
      # to ignore it.
      - name: Unit and data checks
        run: npm test

      - name: Build
        run: npm run build

      # Published straight from the job that checked it. Rebuilding in `deploy`
      # would publish something no test has seen.
      - name: Setup Pages
        if: github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v5
        with:
          # Turn Pages on rather than expecting someone to have done it in the
          # settings first. If this step fails with "Get Pages site failed",
          # Pages is not available for the repository at all — which is the case
          # for a private repository on a free plan.
          enablement: true

      - name: Upload the site
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    # Manual runs publish too, which is what you want when working out why a
    # publish did not happen.
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: check
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
